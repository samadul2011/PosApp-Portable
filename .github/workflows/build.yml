name: Build Portable PosApp

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean package -B -V
      
    - name: Build portable package
      run: |
        chmod +x build-portable.sh
        ./build-portable.sh
        
    - name: Get package info
      id: package_info
      run: |
        echo "Package created:"
        ls -lh PosApp-Portable-*.zip
        echo "package_name=$(ls PosApp-Portable-*.zip)" >> $GITHUB_OUTPUT
        
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: PosApp-Portable
        path: PosApp-Portable-*.zip
        retention-days: 30
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: PosApp-Portable-*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
